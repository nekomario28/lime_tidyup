services:
  lime_simul_demo:
    image: course_lime-image
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    # network_mode: host
    privileged: true
    ipc: host
    ports: 
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8080:8080"
    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/tmp
      - PULSE_SERVER=${PULSE_SERVER}
      - ONESTAGE_EXPOSE=true
      - BUILDING_EDITOR_EXPOSE=true
    volumes:
      - ./pytwb_ws:/root/pytwb_ws:rw
      - ./bin:/root/bin:rw
      - ./roscommon:/root/roscommon:rw
      - $HOME/.Xauthority:/root/.Xauthority
      - ./practice_ws:/root/practice_ws:rw
    command: xterm -fn 12X24 -display ${DISPLAY} -T 'cm main'

