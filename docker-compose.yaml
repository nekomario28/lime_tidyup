services:
  lime_simul_demo:
    image: course_lime-image
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ROS_DISTRO: humble
    network_mode: host
    privileged: true
    ipc: host
    ports: 
      - "3000:3000"
      - "8000:8000"
      - "9090:9090"
      - "8080:8080"
    environment:
      - DISPLAY=${DISPLAY}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/tmp
      - PULSE_SERVER=${PULSE_SERVER}
    volumes:
      - ./pytwb_ws:/root/pytwb_ws:rw
      - ./bin:/root/bin:rw
      - ./roscommon:/root/roscommon:rw
      - $HOME/.Xauthority:/root/.Xauthority
      - ./practice_ws:/root/practice_ws:rw
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
      - type: bind
        source: '${XDG_RUNTIME_DIR}/wayland-0'
        target: /tmp/wayland-0
    command: terminator
