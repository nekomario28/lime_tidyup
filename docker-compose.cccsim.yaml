# Simulation override for bin/cccsim, in the same shape as docker-compose.ccc.yaml:
# both services are kept alive so the host script can exec one stage at a time,
# and the host evidence directory is mounted where the stages write their logs.
services:
  lime_simul_demo_yuu:
    command: ["sleep", "infinity"]
    environment:
      ROS_DOMAIN_ID: "20"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: /root/bin/cyclone.xml
      GAZEBO_MODEL_DATABASE_URI: ""
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - ./sim:/root/repo/sim:ro
      # the cube is generated by barcode_detector, so its source must be readable
      # here too (read-only: this service never builds it)
      - ./yolo_ws/src:/root/repo/yolo_ws/src:ro
      - ${CCCSIM_EVIDENCE_DIR:-./yolo_ws/log/cccsim/direct-compose}:/root/cccsim_evidence:rw

  yolo:
    # The perception here is model-free (colour region + geometry), so it needs
    # no ultralytics: the Lime image already has ROS, cv2 and numpy. Set
    # CCCSIM_YOLO_IMAGE to use the real yolo_ros2-image_yuu if you have it.
    image: ${CCCSIM_YOLO_IMAGE:-course_lime-image_yuu}
    command: ["sleep", "infinity"]
    environment:
      ROS_DOMAIN_ID: "20"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: /root/bin/cyclone.xml
    volumes:
      - ./sim:/root/repo/sim:ro
      - ${CCCSIM_EVIDENCE_DIR:-./yolo_ws/log/cccsim/direct-compose}:/root/cccsim_evidence:rw
