# MuJoCo plugins for the grasp stack.
#
# `/cmd_vel` is served here rather than by wheel joints: the URDF declares velocity command
# interfaces for the wheels, and the hardware interface documents that a velocity command
# needs a velocity/intvelocity actuator (a position actuator cannot serve one), so the
# wheels would need their own actuators and a diff-drive controller on top. The plugin
# instead overrides the base's free-joint velocity directly -- the mechanism the
# package's own mobile-base demo uses -- which is enough for the few centimetres the
# grasp drives and keeps the base from being pushed around by contacts.
#
# `body` must be the free root of the scene: build_scene.py gives base_footprint a
# floating joint, so that is the body with the free joint the plugin looks for.
/**:
  ros__parameters:
    mujoco_plugins:
      base_velocity_plugin:
        type: "mujoco_ros2_control_plugins/BaseVelocityPlugin"
        body: "base_footprint"
        cmd_vel_topic: "/cmd_vel"
        use_stamped_twist: false
        max_linear_velocity: 1.5
        max_yaw_rate: 1.5
        cmd_timeout: 0.5

      # The camera the perception reads. The MJCF camera is named `sim_camera`
      # (build_scene.py adds it at the mount pose), and the plugin names its parameters
      # after it, so this block's key and the scene must agree. Topics are the ones the
      # perception node already subscribes to, so it needs no change.
      mujoco_camera_plugin:
        type: "mujoco_ros2_control_plugins/CameraPlugin"
        camera_publish_rate: 10.0
        sim_camera:
          policy: streaming
          frame_name: sim_camera_color_optical_frame
          info_topic: /camera/camera/color/camera_info
          image_topic: /camera/camera/color/image_raw
          depth_topic: /camera/camera/depth_cam/depth/image_raw
      # Publishes the free-joint states, i.e. where the cube (and the floating base)
      # actually are. This is the measuring instrument for the physics question: whether
      # the cube is still between the fingers after the lift is a distance between two
      # bodies, and nothing else in the stack can see the cube in MuJoCo.
      free_joint_state_publisher:
        type: "mujoco_ros2_control_plugins/FreeJointStatePublisherPlugin"
        frame_id: ""
        topic: /free_joint_states
        publish_rate: 50.0
