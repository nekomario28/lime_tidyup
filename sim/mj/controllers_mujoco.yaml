# Controllers for the MuJoCo backend, in the shape the running stack already spawns.
#
# The types and joints are the description's own (turtlebot3_lime_bringup's
# gazebo_controller_manager.yaml) with the imu broadcaster dropped, because the MuJoCo
# scene declares no IMU sensor and nothing in the grasp path reads one. Keeping the same
# three controllers is what lets bin/cccsim's controllers stage, MoveIt and the grasp
# script work unchanged.
controller_manager:
  ros__parameters:
    use_sim_time: true
    # The demo's own rate; the scene steps at MuJoCo's timestep, not at this figure.
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: position_controllers/GripperActionController

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 200.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

gripper_controller:
  ros__parameters:
    use_sim_time: true
    joint: gripper_left_joint

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
